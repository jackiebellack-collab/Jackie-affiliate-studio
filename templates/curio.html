<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: #faf8f5; color: #1a1410; min-height: 100vh; }

header {
  background: linear-gradient(135deg, #1a1410, #2d2018);
  padding: 20px 24px 0;
  position: sticky; top: 0; z-index: 100;
}

.header-top { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.logo-sub { font-size: 0.6rem; letter-spacing: 0.25em; color: #c8a882; text-transform: uppercase; margin-bottom: 3px; }
.logo { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; color: #faf8f5; letter-spacing: 0.04em; }
.logo span { color: #c8a882; font-style: italic; }
.header-meta { font-size: 0.72rem; color: rgba(255,255,255,0.4); }
.header-tagline { font-size: 0.7rem; color: rgba(255,255,255,0.3); max-width: 960px; margin: 0 auto 14px; }

.save-btn {
  background: transparent; color: #c8a882; border: 1px solid #c8a882;
  border-radius: 6px; padding: 9px 18px; font-size: 0.78rem;
  cursor: pointer; font-family: 'DM Sans', sans-serif; letter-spacing: 0.04em;
  transition: all 0.2s;
}
.save-btn.active { background: #c8a882; color: #1a1410; }

.quick-links-bar { border-top: 1px solid rgba(255,255,255,0.08); padding: 12px 0 14px; max-width: 960px; margin: 0 auto; }
.ql-inner { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.ql-label { font-size: 0.6rem; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; margin-right: 4px; }
.ql-link {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.8);
  border-radius: 20px; padding: 5px 12px; font-size: 0.72rem;
  text-decoration: none; white-space: nowrap;
  border: 1px solid rgba(255,255,255,0.1); transition: all 0.15s;
  position: relative;
}
.ql-link:hover { background: rgba(200,168,130,0.2); color: #c8a882; }
.ql-remove { position: absolute; top: -4px; right: -4px; width: 14px; height: 14px; background: rgba(255,255,255,0.15); border: none; border-radius: 50%; color: rgba(255,255,255,0.5); cursor: pointer; font-size: 0.5rem; display: flex; align-items: center; justify-content: center; padding: 0; }
.ql-add-btn { display: inline-flex; align-items: center; gap: 4px; background: transparent; color: #c8a882; border: 1px dashed rgba(200,168,130,0.4); border-radius: 20px; padding: 5px 12px; font-size: 0.7rem; cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap; }

.add-link-form { background: rgba(255,255,255,0.06); border-radius: 10px; padding: 14px; margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.alf-label { font-size: 0.6rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; display: block; }
.alf-input { padding: 7px 10px; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; font-size: 0.8rem; background: rgba(255,255,255,0.08); color: white; font-family: 'DM Sans', sans-serif; width: 100%; box-sizing: border-box; }
.alf-submit { background: #c8a882; color: #1a1410; border: none; border-radius: 6px; padding: 8px 16px; font-size: 0.78rem; cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap; }

.main { max-width: 960px; margin: 0 auto; padding: 20px 16px; }

.add-form { background: white; border: 1px solid #e8e0d8; border-radius: 14px; padding: 22px; margin-bottom: 22px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); display: none; }
.add-form.visible { display: block; }
.form-title { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.form-field { margin-bottom: 12px; }
.form-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: #9a8a7a; margin-bottom: 5px; display: block; }
.form-input { width: 100%; padding: 9px 12px; border: 1px solid #e8e0d8; border-radius: 6px; font-size: 0.82rem; font-family: 'DM Sans', sans-serif; background: #faf8f5; color: #1a1410; box-sizing: border-box; }
.form-input:focus { outline: none; border-color: #c8a882; }
.submit-btn { background: #1a1410; color: #c8a882; border: none; border-radius: 8px; padding: 12px 28px; font-size: 0.88rem; cursor: pointer; font-family: 'DM Sans', sans-serif; letter-spacing: 0.04em; }

.cat-pills { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
.cat-pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 20px; padding: 7px 14px; font-size: 0.75rem; cursor: pointer; font-family: 'DM Sans', sans-serif; white-space: nowrap; border: 1px solid #e8e0d8; background: white; color: #6a5a4a; transition: all 0.15s; }
.cat-count { border-radius: 10px; padding: 1px 6px; font-size: 0.65rem; background: #f0e8e8; color: #9a8a7a; }

.filter-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.search-input { padding: 9px 14px; border: 1px solid #e8e0d8; border-radius: 6px; font-size: 0.82rem; font-family: 'DM Sans', sans-serif; background: white; min-width: 200px; }
.search-input:focus { outline: none; border-color: #c8a882; }
.tag-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.tag-pill { border-radius: 20px; padding: 5px 12px; font-size: 0.68rem; cursor: pointer; font-family: 'DM Sans', sans-serif; border: 1px solid #e8e0d8; background: white; color: #6a5a4a; transition: all 0.15s; }

.results-count { font-size: 0.72rem; color: #9a8a7a; margin-bottom: 14px; }

.saves-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }

.save-card { background: white; border: 1px solid #e8e0d8; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: transform 0.15s, box-shadow 0.15s; }
.save-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
.save-card-bar { height: 4px; }
.save-card-body { padding: 14px; }
.save-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.save-card-left { display: flex; align-items: center; gap: 6px; }
.cat-emoji { font-size: 1.1rem; }
.tag-badge { border-radius: 10px; padding: 2px 8px; font-size: 0.62rem; font-weight: 600; }
.save-date { font-size: 0.65rem; color: #b8a898; }
.save-title { font-size: 0.92rem; font-weight: 600; margin-bottom: 6px; line-height: 1.35; }
.save-price { font-size: 0.78rem; color: #c45c72; margin-bottom: 6px; }
.save-note { font-size: 0.75rem; color: #7a6a5a; font-style: italic; line-height: 1.5; margin-bottom: 8px; }
.save-source { font-size: 0.65rem; color: #9a8a7a; margin-bottom: 10px; }
.save-actions { display: flex; gap: 6px; margin-bottom: 8px; }
.open-link { flex: 1; background: #1a1410; color: white; border-radius: 6px; padding: 7px; font-size: 0.7rem; text-decoration: none; text-align: center; }
.copy-btn, .edit-btn { background: #faf8f5; color: #6a5a4a; border: 1px solid #e8e0d8; border-radius: 6px; padding: 7px 10px; font-size: 0.7rem; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.copy-btn.copied { background: #d4f0e8; color: #3d8b5e; }

.edit-panel { border-top: 1px solid #f0e8e8; padding-top: 10px; display: none; flex-direction: column; gap: 7px; }
.edit-panel.visible { display: flex; }
.edit-input { width: 100%; padding: 6px 8px; border: 1px solid #e8e0d8; border-radius: 6px; font-size: 0.75rem; font-family: 'DM Sans', sans-serif; background: #faf8f5; color: #1a1410; box-sizing: border-box; }
.remove-btn { background: #fff0f0; color: #c45c72; border: 1px solid #f2c4ce; border-radius: 6px; padding: 6px; font-size: 0.7rem; cursor: pointer; font-family: 'DM Sans', sans-serif; }

.empty-state { text-align: center; padding: 60px 20px; color: #9a8a7a; }
.empty-emoji { font-size: 2rem; margin-bottom: 12px; }

.footer { margin-top: 32px; padding: 16px 20px; background: linear-gradient(135deg, #1a1410, #2d2018); border-radius: 12px; text-align: center; }
.footer-name { font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: #c8a882; margin-bottom: 4px; }
.footer-sub { font-size: 0.72rem; color: rgba(255,255,255,0.4); }

.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1a1410; color: #c8a882; padding: 10px 24px; border-radius: 20px; font-size: 0.85rem; z-index: 9999; box-shadow: 0 4px 16px rgba(0,0,0,0.2); display: none; white-space: nowrap; }
.toast.visible { display: block; }

@media (max-width: 600px) {
  .form-grid { grid-template-columns: 1fr; }
  .saves-grid { grid-template-columns: 1fr; }
  header { padding: 16px 16px 0; }
  .main { padding: 16px 12px; }
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<header>
  <div class="header-top">
    <div>
      <div class="logo-sub">My</div>
      <div class="logo">Curi<span>o</span></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="header-meta" id="saveCount">0 saved</div>
      <button class="save-btn" id="saveToggleBtn" onclick="toggleAddForm()">+ Save Something</button>
    </div>
  </div>
  <div class="header-tagline">Everything you discover, in one place</div>

  <div class="quick-links-bar">
    <div class="ql-inner" id="qlInner">
      <span class="ql-label">Quick Links</span>
      <div id="qlLinks"></div>
      <button class="ql-add-btn" onclick="toggleAddLink()">+ Add</button>
    </div>
    <div class="add-link-form" id="addLinkForm" style="display:none;">
      <div style="flex:0 0 60px;">
        <label class="alf-label">Emoji</label>
        <input class="alf-input" id="lfEmoji" value="🔗" style="text-align:center;width:60px;">
      </div>
      <div style="flex:1;min-width:100px;">
        <label class="alf-label">Name</label>
        <input class="alf-input" id="lfName" placeholder="e.g. Bergdorf">
      </div>
      <div style="flex:2;min-width:140px;">
        <label class="alf-label">URL</label>
        <input class="alf-input" id="lfUrl" placeholder="e.g. bergdorfgoodman.com">
      </div>
      <button class="alf-submit" onclick="addQuickLink()">Add</button>
    </div>
  </div>
</header>

<div class="main">
  <div class="add-form" id="addForm">
    <div class="form-title">Save something you discovered 🌸</div>
    <div class="form-field">
      <label class="form-label">Paste a link</label>
      <input class="form-input" id="fUrl" placeholder="Paste any URL — Instagram, website, newsletter...">
    </div>
    <div class="form-field">
      <label class="form-label">Title / What is it? *</label>
      <input class="form-input" id="fTitle" placeholder="e.g. Cream linen sofa, Salmon recipe, Floral dress...">
    </div>
    <div class="form-grid">
      <div>
        <label class="form-label">Category</label>
        <select class="form-input" id="fCategory">
          <option value="fashion">👗 Fashion</option>
          <option value="interiors">🏠 Home</option>
          <option value="food">🍝 Food & Recipes</option>
          <option value="beauty">💄 Beauty & Wellness</option>
          <option value="travel">✈️ Travel</option>
          <option value="gifts">🎁 Gifts</option>
          <option value="todo">🎭 Things to Do</option>
          <option value="other">📌 Other</option>
        </select>
      </div>
      <div>
        <label class="form-label">Tag</label>
        <select class="form-input" id="fTag">
          <option>Want</option>
          <option>Love</option>
          <option>Bought</option>
          <option>Shared</option>
          <option>Inspo</option>
        </select>
      </div>
      <div>
        <label class="form-label">Where did you find it?</label>
        <select class="form-input" id="fSource">
          <option>Instagram</option>
          <option>TikTok</option>
          <option>Pinterest</option>
          <option>Newsletter</option>
          <option>Website</option>
          <option>Friend</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label class="form-label">Price (optional)</label>
        <input class="form-input" id="fPrice" placeholder="e.g. $89">
      </div>
    </div>
    <div class="form-field">
      <label class="form-label">Note to yourself</label>
      <input class="form-input" id="fNote" placeholder="e.g. Saw on @creator, perfect for living room...">
    </div>
    <button class="submit-btn" onclick="addSave()">Save It 🌸</button>
  </div>

  <div class="cat-pills" id="catPills"></div>

  <div class="filter-row">
    <input class="search-input" id="searchInput" placeholder="Search your saves..." oninput="renderSaves()">
    <div class="tag-pills" id="tagPills"></div>
  </div>

  <div class="results-count" id="resultsCount"></div>
  <div class="saves-grid" id="savesGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-emoji">🌸</div>
    <div style="margin-bottom:8px;font-size:0.9rem;">Nothing here yet!</div>
    <div style="font-size:0.78rem;">Hit "+ Save Something" to start your Curio</div>
  </div>

  <div class="footer">
    <div class="footer-name">Curio</div>
    <div class="footer-sub">Everything you discover, in one place</div>
  </div>
</div>

<script>
const CATEGORIES = [
  { id: "all", label: "All Saves", emoji: "✨", color: "#1a1410" },
  { id: "fashion", label: "Fashion", emoji: "👗", color: "#c45c72" },
  { id: "interiors", label: "Home", emoji: "🏠", color: "#8b7355" },
  { id: "food", label: "Food & Recipes", emoji: "🍝", color: "#c8692a" },
  { id: "beauty", label: "Beauty & Wellness", emoji: "💄", color: "#a855a0" },
  { id: "travel", label: "Travel", emoji: "✈️", color: "#2a7cc8" },
  { id: "gifts", label: "Gifts", emoji: "🎁", color: "#3d8b5e" },
  { id: "todo", label: "Things to Do", emoji: "🎭", color: "#2a9cc8" },
  { id: "other", label: "Other", emoji: "📌", color: "#6a5a9a" },
];

const TAGS = ["All", "Want", "Love", "Bought", "Shared", "Inspo"];
const TAG_COLORS = {
  Want: { bg: "#fdf0f5", color: "#c45c72", border: "#f2c4ce" },
  Love: { bg: "#fff8e8", color: "#c8692a", border: "#f0d8b0" },
  Bought: { bg: "#f0f7f0", color: "#3d8b5e", border: "#a8d8b0" },
  Shared: { bg: "#f0f0fd", color: "#5c5cc4", border: "#c4c4f2" },
  Inspo: { bg: "#f5f0fd", color: "#a855a0", border: "#d8b0e0" },
};

const DEFAULT_LINKS = [
  { id: 1, name: "Nordstrom", url: "https://nordstrom.com", emoji: "🛍️" },
  { id: 2, name: "Revolve", url: "https://revolve.com", emoji: "✨" },
  { id: 3, name: "Zara", url: "https://zara.com", emoji: "🖤" },
  { id: 4, name: "Amazon", url: "https://amazon.com/fashion", emoji: "📦" },
  { id: 5, name: "Pinterest", url: "https://pinterest.com", emoji: "📌" },
  { id: 6, name: "Instagram", url: "https://instagram.com", emoji: "📸" },
];

const SAMPLE_SAVES = [
  { id: 1, title: "Lunaria Floral Print Sleeveless Dress", url: "https://revolve.com", category: "fashion", tag: "Want", note: "Saw on @styleinspo stories", source: "Instagram", price: "$89", date: "Apr 10" },
  { id: 2, title: "Cream Linen Sofa", url: "https://article.com", category: "interiors", tag: "Love", note: "Perfect for living room", source: "Newsletter", price: "$1,299", date: "Apr 9" },
  { id: 3, title: "One Pan Lemon Butter Salmon", url: "https://halfbakedharvest.com", category: "food", tag: "Inspo", note: "Make this weekend", source: "Instagram", price: "", date: "Apr 8" },
  { id: 4, title: "Rhode Peptide Lip Tint", url: "https://rhodeskin.com", category: "beauty", tag: "Want", note: "Everyone is talking about this", source: "TikTok", price: "$26", date: "Apr 7" },
];

let saves = JSON.parse(localStorage.getItem('curioSaves') || 'null') || SAMPLE_SAVES;
let quickLinks = JSON.parse(localStorage.getItem('curioLinks') || 'null') || DEFAULT_LINKS;
let activeCategory = 'all';
let activeTag = 'All';
let showAddForm = false;
let showAddLink = false;

function persist() {
  localStorage.setItem('curioSaves', JSON.stringify(saves));
  localStorage.setItem('curioLinks', JSON.stringify(quickLinks));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 2500);
}

function toggleAddForm() {
  showAddForm = !showAddForm;
  document.getElementById('addForm').classList.toggle('visible', showAddForm);
  const btn = document.getElementById('saveToggleBtn');
  btn.textContent = showAddForm ? '✕ Cancel' : '+ Save Something';
  btn.classList.toggle('active', showAddForm);
}

function toggleAddLink() {
  showAddLink = !showAddLink;
  document.getElementById('addLinkForm').style.display = showAddLink ? 'flex' : 'none';
}

function addSave() {
  const title = document.getElementById('fTitle').value.trim();
  const url = document.getElementById('fUrl').value.trim();
  if (!title && !url) return;
  const today = new Date();
  const date = today.toLocaleString('default', { month: 'short' }) + ' ' + today.getDate();
  saves.unshift({
    id: Date.now(),
    title: title || url,
    url, price: document.getElementById('fPrice').value,
    category: document.getElementById('fCategory').value,
    tag: document.getElementById('fTag').value,
    source: document.getElementById('fSource').value,
    note: document.getElementById('fNote').value,
    date
  });
  persist();
  ['fTitle','fUrl','fPrice','fNote'].forEach(id => document.getElementById(id).value = '');
  toggleAddForm();
  showToast('Saved to Curio! 🌸');
  renderAll();
}

function addQuickLink() {
  const name = document.getElementById('lfName').value.trim();
  const url = document.getElementById('lfUrl').value.trim();
  if (!name || !url) return;
  quickLinks.push({ id: Date.now(), name, url: url.startsWith('http') ? url : 'https://' + url, emoji: document.getElementById('lfEmoji').value || '🔗' });
  persist();
  document.getElementById('lfName').value = '';
  document.getElementById('lfUrl').value = '';
  document.getElementById('lfEmoji').value = '🔗';
  toggleAddLink();
  showToast('Link added! 🔗');
  renderQuickLinks();
}

function removeLink(id) {
  quickLinks = quickLinks.filter(l => l.id !== id);
  persist();
  renderQuickLinks();
}

function removeSave(id) {
  saves = saves.filter(s => s.id !== id);
  persist();
  renderAll();
}

function updateSave(id, field, value) {
  saves = saves.map(s => s.id === id ? { ...s, [field]: value } : s);
  persist();
}

function getCat(id) { return CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length-1]; }

function renderQuickLinks() {
  const container = document.getElementById('qlLinks');
  container.innerHTML = quickLinks.map(l => `
    <span style="position:relative;display:inline-flex;margin-right:8px;">
      <a href="${l.url}" target="_blank" class="ql-link">${l.emoji} ${l.name}</a>
      <button class="ql-remove" onclick="removeLink(${l.id})">✕</button>
    </span>
  `).join('');
}

function renderCatPills() {
  const counts = {};
  CATEGORIES.forEach(c => counts[c.id] = c.id === 'all' ? saves.length : saves.filter(s => s.category === c.id).length);
  document.getElementById('catPills').innerHTML = CATEGORIES.map(cat => `
    <button class="cat-pill" onclick="setCategory('${cat.id}')"
      style="background:${activeCategory===cat.id?cat.color:'white'};color:${activeCategory===cat.id?'white':'#6a5a4a'};border-color:${activeCategory===cat.id?cat.color:'#e8e0d8'}">
      ${cat.emoji} ${cat.label}
      <span class="cat-count" style="background:${activeCategory===cat.id?'rgba(255,255,255,0.25)':'#f0e8e8'};color:${activeCategory===cat.id?'white':'#9a8a7a'}">${counts[cat.id]}</span>
    </button>
  `).join('');
}

function renderTagPills() {
  const TC = TAG_COLORS;
  document.getElementById('tagPills').innerHTML = TAGS.map(tag => {
    const active = activeTag === tag;
    const bg = active ? (tag === 'All' ? '#1a1410' : TC[tag]?.bg) : 'white';
    const color = active ? (tag === 'All' ? 'white' : TC[tag]?.color) : '#6a5a4a';
    const border = tag === 'All' ? '#e8e0d8' : TC[tag]?.border || '#e8e0d8';
    return `<button class="tag-pill" onclick="setTag('${tag}')" style="background:${bg};color:${color};border-color:${border}">${tag}</button>`;
  }).join('');
}

function setCategory(id) { activeCategory = id; renderAll(); }
function setTag(tag) { activeTag = tag; renderAll(); }

function renderSaves() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filtered = saves.filter(s => {
    const matchCat = activeCategory === 'all' || s.category === activeCategory;
    const matchTag = activeTag === 'All' || s.tag === activeTag;
    const matchSearch = s.title.toLowerCase().includes(search) || (s.note||'').toLowerCase().includes(search);
    return matchCat && matchTag && matchSearch;
  });

  document.getElementById('saveCount').textContent = saves.length + ' saved';
  const catLabel = activeCategory !== 'all' ? ` in ${getCat(activeCategory).label}` : '';
  document.getElementById('resultsCount').textContent = `${filtered.length} ${filtered.length===1?'save':'saves'}${catLabel}`;
  document.getElementById('emptyState').style.display = filtered.length === 0 ? 'block' : 'none';
  document.getElementById('savesGrid').style.display = filtered.length === 0 ? 'none' : 'grid';

  document.getElementById('savesGrid').innerHTML = filtered.map(save => {
    const cat = getCat(save.category);
    const tc = TAG_COLORS[save.tag] || TAG_COLORS.Want;
    return `
      <div class="save-card">
        <div class="save-card-bar" style="background:${cat.color}"></div>
        <div class="save-card-body">
          <div class="save-card-top">
            <div class="save-card-left">
              <span class="cat-emoji">${cat.emoji}</span>
              <span class="tag-badge" style="background:${tc.bg};color:${tc.color};border:1px solid ${tc.border}">${save.tag}</span>
            </div>
            <span class="save-date">${save.date||''}</span>
          </div>
          <div class="save-title">${save.title}</div>
          ${save.price ? `<div class="save-price">${save.price}</div>` : ''}
          ${save.note ? `<div class="save-note">"${save.note}"</div>` : ''}
          <div class="save-source">via ${save.source||'Web'}</div>
          <div class="save-actions">
            <a href="${save.url||'#'}" target="_blank" class="open-link">Open Link →</a>
            <button class="copy-btn" id="copy-${save.id}" onclick="copyUrl(${save.id},'${(save.url||'').replace(/'/g,"\\'")}')">Copy</button>
            <button class="edit-btn" onclick="toggleEdit(${save.id})">✏️</button>
          </div>
          <div class="edit-panel" id="edit-${save.id}">
            <select class="edit-input" onchange="updateSave(${save.id},'tag',this.value)">
              ${['Want','Love','Bought','Shared','Inspo'].map(t => `<option ${save.tag===t?'selected':''}>${t}</option>`).join('')}
            </select>
            <select class="edit-input" onchange="updateSave(${save.id},'category',this.value)">
              ${CATEGORIES.filter(c=>c.id!=='all').map(c => `<option value="${c.id}" ${save.category===c.id?'selected':''}>${c.emoji} ${c.label}</option>`).join('')}
            </select>
            <input class="edit-input" placeholder="Edit note..." value="${save.note||''}" onblur="updateSave(${save.id},'note',this.value)">
            <input class="edit-input" placeholder="Price..." value="${save.price||''}" onblur="updateSave(${save.id},'price',this.value)">
            <button class="remove-btn" onclick="removeSave(${save.id})">Remove</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function copyUrl(id, url) {
  navigator.clipboard.writeText(url);
  const btn = document.getElementById('copy-' + id);
  btn.textContent = '✓';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
}

function toggleEdit(id) {
  const panel = document.getElementById('edit-' + id);
  panel.classList.toggle('visible');
}

function renderAll() {
  renderCatPills();
  renderTagPills();
  renderSaves();
}

renderQuickLinks();
renderAll();
</script>
</body>
</html>
