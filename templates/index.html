<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackie's Affiliate Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --blush: #f2c4ce;
            --rose: #e8899a;
            --deep-rose: #c45c72;
            --cream: #fdf6f0;
            --warm-white: #fffaf7;
            --charcoal: #2d2020;
            --muted: #9a7c7c;
            --gold: #d4a96a;
            --soft-gold: #f0dfc0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--warm-white);
            color: var(--charcoal);
            min-height: 100vh;
        }

        header {
            background: var(--charcoal);
            padding: 18px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--blush);
            letter-spacing: 0.02em;
        }

        .logo span { color: var(--gold); font-style: italic; }

        .header-date {
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .progress-bar {
            background: white;
            border-bottom: 1px solid #f0e8e8;
            padding: 0 32px;
            display: flex;
            gap: 0;
            overflow-x: auto;
        }

        .step-tab {
            padding: 14px 20px;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 3px solid transparent;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step-tab.active { color: var(--deep-rose); border-bottom-color: var(--deep-rose); }
        .step-tab.completed { color: var(--gold); border-bottom-color: var(--gold); }

        .step-num {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: currentColor;
            color: white;
            font-size: 0.65rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .step-tab.active .step-num { background: var(--deep-rose); color: white; }
        .step-tab.completed .step-num { background: var(--gold); color: white; }
        .step-tab:not(.active):not(.completed) .step-num { background: #e8e0e0; color: var(--muted); }

        .main { max-width: 900px; margin: 0 auto; padding: 32px 20px; }

        .step-panel { display: none; animation: fadeIn 0.3s ease; }
        .step-panel.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .panel-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--charcoal); margin-bottom: 6px; }
        .panel-title em { color: var(--deep-rose); font-style: italic; }
        .panel-subtitle { color: var(--muted); font-size: 0.88rem; margin-bottom: 28px; font-weight: 300; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            letter-spacing: 0.03em;
        }

        .btn-primary { background: var(--deep-rose); color: white; }
